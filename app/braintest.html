<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <title>Brain map — test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c14; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #label-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
    #tt {
      position: fixed; display: none; pointer-events: none;
      background: rgba(12,14,26,0.93); color: #fff;
      padding: 6px 11px; border-radius: 7px;
      font: 12px/1.5 system-ui, sans-serif;
      border: 1px solid rgba(255,255,255,0.07);
    }
    #note {
      position: fixed; bottom: 14px; right: 16px;
      color: rgba(255,255,255,0.2); font: 10px system-ui, sans-serif;
      letter-spacing: 0.05em; pointer-events: none;
    }
  </style>
</head>
<body>
<svg id="canvas"></svg>
<svg id="label-layer"></svg>
<div id="tt"></div>
<div id="note">braintest.html — remove after review</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const CONTINENTS = {
  "1":     "#378ADD",  // Matemaatika
  "2":     "#9F8FE8",  // Mina
  "3":     "#7ABF3C",  // Maailm
  "1000":  "#E84B7A",  // Eesti keel
  "2000":  "#C0476E",  // Kirjandus
  "3000":  "#20A89A",  // Loodusõpetus
  "4000":  "#4C9E2C",  // Bioloogia
  "5000":  "#D4873C",  // Geograafia
  "6000":  "#E05430",  // Füüsika
  "7000":  "#B040A8",  // Keemia
  "8000":  "#8B5E3C",  // Ajalugu
  "9000":  "#A0722A",  // Ühiskonnaõpetus
  "10000": "#E8A030",  // Inimeseõpetus
  "11000": "#D43EA0",  // Kunstiõpetus
  "12000": "#7040C8",  // Muusika
  "13000": "#2E8BC0",  // Kehaline kasvatus
  "14000": "#C06830",  // Käsitöö
  "15000": "#9E7030",  // Tööõpetus
  "16000": "#3A9AE0",  // Inglise keel
  "17000": "#5080C8",  // Teine võõrkeel
  "18000": "#607080",  // Tehnoloogiaõpetus
  "19000": "#A06858",  // Keraamika
  "20000": "#C85858",  // Toiduõpetus
};

// Angles (radians, clockwise) for each L1 subject around the brain curve.
// SVG convention: t=0 → right, t=π/2 → bottom, t=π → left, t=-π/2 → top.
// Brain dip sits at t = -π/2 ≈ -1.571; no subject is placed there.
//
// Groups (clockwise from top-right):
//   Top-right lobe  : Languages (Eesti keel, Kirjandus, Inglise keel, Teine võõrkeel)
//   Right           : Applied / tech (Tehnoloogiaõpetus, Keraamika, Toiduõpetus)
//   Bottom-right    : Exact sciences (Matemaatika, Füüsika, Keemia)
//   Bottom          : Natural sciences (Bioloogia, Loodusõpetus, Geograafia)
//   Bottom-left     : Social / human (Ajalugu, Ühiskonnaõpetus, Inimeseõpetus, Mina, Maailm)
//   Left            : Applied creative (Käsitöö, Tööõpetus)
//   Top-left lobe   : Arts / physical (Kehaline kasvatus, Kunstiõpetus, Muusika)
const SUBJECT_ANGLES = {
  "1000":  -1.40,  // Eesti keel
  "2000":  -1.12,  // Kirjandus
  "16000": -0.80,  // Inglise keel
  "17000": -0.50,  // Teine võõrkeel
  "18000": -0.16,  // Tehnoloogiaõpetus
  "19000":  0.18,  // Keraamika
  "20000":  0.48,  // Toiduõpetus
  "1":      0.78,  // Matemaatika
  "6000":   1.05,  // Füüsika
  "7000":   1.28,  // Keemia
  "4000":   1.48,  // Bioloogia
  "3000":   1.65,  // Loodusõpetus
  "5000":   1.82,  // Geograafia
  "8000":   2.04,  // Ajalugu
  "9000":   2.27,  // Ühiskonnaõpetus
  "10000":  2.52,  // Inimeseõpetus
  "2":      2.76,  // Mina
  "3":      3.00,  // Maailm
  "14000": -3.05,  // Käsitöö
  "15000": -2.80,  // Tööõpetus
  "13000": -2.50,  // Kehaline kasvatus
  "11000": -2.15,  // Kunstiõpetus
  "12000": -1.84,  // Muusika
};

const W  = window.innerWidth;
const H  = window.innerHeight;
const cx = W / 2;
const cy = H / 2 + 14;
const rx = Math.min(W, H) * 0.40;
const ry = Math.min(W, H) * 0.37;

// Brain-shaped parametric curve: modified ellipse with two lobe bumps at the
// top and a central dip (interhemispheric fissure). Only the top half is
// modified; the bottom remains a plain ellipse.
function brainXY(t) {
  let px = cx + rx * Math.cos(t);
  let py = cy + ry * Math.sin(t);
  if (Math.sin(t) < 0) {
    const s  = -Math.sin(t);                        // 0 at equator, 1 at apex
    const c2 = Math.cos(t) * Math.cos(t);
    const lobePush = 0.16 * ry * s * c2;            // outward bulge off-centre
    const dipPush  = -0.14 * ry * s * Math.exp(-5 * c2); // inward dip at centre
    const push = lobePush + dipPush;
    px += push * Math.cos(t);
    py += push * Math.sin(t);
  }
  return { x: px, y: py };
}

// Brain outline SVG path (decorative background ring)
const N = 240;
const outlinePts = Array.from({ length: N + 1 }, (_, i) => {
  const t = -Math.PI + (i / N) * 2 * Math.PI;
  return brainXY(t);
});
const outlinePath = "M " + outlinePts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L ") + " Z";

// Seed positions on the brain curve for each L1 subject
const brainSeeds = {};
Object.entries(SUBJECT_ANGLES).forEach(([id, t]) => {
  const p = brainXY(t);
  brainSeeds[id] = { x: p.x, y: p.y };
});

const tt = document.getElementById("tt");
const nodeRadius = d => d.level === 1 ? 16 : d.level === 2 ? 9 : d.level === 3 ? 5.5 : d.level === 4 ? 4 : 3;
const FONT_SIZE   = { 1: 13, 2: 11, 3: 10, 4: 9, 5: 8 };
const FONT_WEIGHT = { 1: 600, 2: 500, 3: 400, 4: 400, 5: 400 };
const FADE = 0.25;

fetch('/api/map')
  .then(r => {
    if (!r.ok) {
      document.body.innerHTML = '<p style="color:#aaa;font:14px system-ui;padding:3rem">Please log in first, then navigate here directly.</p>';
      throw new Error('unauth');
    }
    return r.json();
  })
  .then(init)
  .catch(() => {});

function init(data) {
  // ── Build lookups ────────────────────────────────────────────────────────────
  const allNodes = {};
  data.nodes.forEach(n => { allNodes[n.id] = { ...n }; });

  const childrenOf = {};
  const parentOf   = {};
  data.edges.forEach(e => {
    if (!childrenOf[e.source]) childrenOf[e.source] = [];
    childrenOf[e.source].push(e.target);
    parentOf[e.target] = e.source;
  });

  function getContinent(id) {
    let cur = id;
    const seen = new Set();
    while (parentOf[cur] !== undefined && !seen.has(cur)) { seen.add(cur); cur = parentOf[cur]; }
    return cur;
  }
  Object.values(allNodes).forEach(n => {
    n.continentId = getContinent(n.id);
    n.color = CONTINENTS[n.continentId] || "#888";
  });

  // Seed initial positions around the brain outline, scattered by level
  Object.values(allNodes).forEach(n => {
    const seed = brainSeeds[n.continentId];
    if (seed) {
      const scatter = n.level === 1 ? 0 : n.level === 2 ? 55 : n.level === 3 ? 110 : 155;
      n.x = seed.x + (Math.random() - 0.5) * scatter;
      n.y = seed.y + (Math.random() - 0.5) * scatter;
    } else {
      n.x = cx + (Math.random() - 0.5) * 80;
      n.y = cy + (Math.random() - 0.5) * 80;
    }
  });

  // Only show L1–L4 (same as main map default)
  const visibleIds = new Set(Object.values(allNodes).filter(n => n.level <= 4).map(n => n.id));

  // ── SVG setup ────────────────────────────────────────────────────────────────
  const svg      = d3.select("#canvas").attr("width", W).attr("height", H);
  const labelSvg = d3.select("#label-layer").attr("width", W).attr("height", H);

  // Faint brain outline
  svg.append("path")
    .attr("d", outlinePath)
    .attr("fill", "none")
    .attr("stroke", "rgba(110,130,210,0.13)")
    .attr("stroke-width", 2.5);

  const g      = svg.append("g");
  const gLinks = g.append("g");
  const gNodes = g.append("g");

  let currentTransform = d3.zoomIdentity;
  const zoomBeh = d3.zoom().scaleExtent([0.1, 5]).on("zoom", e => {
    g.attr("transform", e.transform);
    currentTransform = e.transform;
    updateLabels();
    repositionLabels();
  });
  svg.call(zoomBeh);

  let link, node, label;

  function rebuild() {
    const simNodes = Array.from(visibleIds).map(id => allNodes[id]);
    const simEdges = data.edges
      .filter(e => visibleIds.has(e.source) && visibleIds.has(e.target))
      .map(e => ({ source: e.source, target: e.target }));

    link = gLinks.selectAll("line").data(simEdges, d => `${d.source}-${d.target}`);
    link.exit().remove();
    link = link.enter().append("line")
      .attr("stroke", d => {
        const src = allNodes[typeof d.source === "object" ? d.source.id : d.source];
        return src ? (CONTINENTS[src.continentId] || "#444") : "#444";
      })
      .attr("stroke-opacity", d => {
        const src = allNodes[typeof d.source === "object" ? d.source.id : d.source];
        return src?.level === 1 ? 0.50 : src?.level === 2 ? 0.35 : src?.level === 3 ? 0.20 : 0.12;
      })
      .attr("stroke-width", d => {
        const src = allNodes[typeof d.source === "object" ? d.source.id : d.source];
        return src?.level === 1 ? 1.5 : src?.level === 2 ? 1 : 0.5;
      })
      .merge(link);

    node = gNodes.selectAll("circle").data(simNodes, d => d.id);
    node.exit().remove();
    node = node.enter().append("circle")
      .attr("r", nodeRadius)
      .attr("fill", d => d.color)
      .attr("fill-opacity", d => d.level === 1 ? 1 : d.level === 2 ? 0.85 : 0.7)
      .attr("stroke", d => d.level <= 2 ? "rgba(255,255,255,0.22)" : "none")
      .attr("stroke-width", 0.5)
      .style("cursor", "default")
      .on("mouseover", (e, d) => {
        tt.style.display = "block";
        const parentLabel = allNodes[d.continentId]?.label || "";
        tt.innerHTML = `<strong style="color:${d.color}">${d.label}</strong>`
          + (d.level > 1 ? `<br><span style="opacity:0.55;font-size:11px">${parentLabel}</span>` : "");
      })
      .on("mousemove", e => { tt.style.left = (e.clientX + 14) + "px"; tt.style.top = (e.clientY - 10) + "px"; })
      .on("mouseout",  () => { tt.style.display = "none"; })
      .merge(node);

    label = labelSvg.selectAll(".lbl").data(simNodes, d => d.id);
    label.exit().remove();
    label = label.enter().append("text")
      .attr("class", "lbl")
      .text(d => d.label)
      .attr("font-size",   d => FONT_SIZE[d.level]   || 9)
      .attr("font-weight", d => FONT_WEIGHT[d.level] || 400)
      .attr("fill", "#fff")
      .attr("text-anchor", "middle")
      .attr("opacity", 0)
      .style("pointer-events", "none")
      .style("user-select", "none")
      .merge(label);

    sim.nodes(simNodes);
    sim.force("link").links(simEdges);
    sim.alpha(0.4).restart();
    updateLabels();
  }

  // ── Force simulation ─────────────────────────────────────────────────────────
  const sim = d3.forceSimulation([])
    .force("link",    d3.forceLink([]).id(d => d.id).strength(0.8))
    .force("charge",  d3.forceManyBody()
      .strength(d => d.level === 1 ? -2500 : d.level === 2 ? -300 : d.level === 3 ? -80 : -25)
      .distanceMax(600))
    .force("collide", d3.forceCollide().radius(d => nodeRadius(d) + 4).strength(0.8))
    .force("x", d3.forceX(d => brainSeeds[d.continentId]?.x ?? cx)
      .strength(d => d.level === 1 ? 0.5 : 0.05))
    .force("y", d3.forceY(d => brainSeeds[d.continentId]?.y ?? cy)
      .strength(d => d.level === 1 ? 0.5 : 0.05))
    .alphaDecay(0.015)
    .velocityDecay(0.4)
    .on("tick", ticked);

  rebuild();

  function ticked() {
    if (link) link
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    if (node) node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);
    repositionLabels();
  }

  function updateLabels() {
    if (!label) return;
    const k = currentTransform.k;
    label.attr("opacity", d => {
      if (d.level === 1) return 1;
      if (d.level === 2) return Math.min(1, Math.max(0, (k - 0.3) / FADE));
      if (d.level === 3) return Math.min(1, Math.max(0, (k - 0.7) / FADE));
      if (d.level === 4) return Math.min(1, Math.max(0, (k - 1.4) / FADE));
      return 0;
    });
  }

  function repositionLabels() {
    if (!label) return;
    const t = currentTransform;
    label
      .attr("x", d => t.applyX(d.x))
      .attr("y", d => t.applyY(d.y) - nodeRadius(d) - 4);
  }
}
</script>
</body>
</html>
