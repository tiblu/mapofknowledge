<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapsevanema vaade — KnobitMap</title>
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/teacher.css">
<link rel="stylesheet" href="css/font-scale.css">
<script>fetch('/api/settings').then(function(r){return r.json();}).then(function(s){var p=s.palette==='midnight'?'vampire':s.palette;if(p&&p!=='sunset')document.documentElement.classList.add('palette-'+p);}).catch(function(){});</script>
<script src="js/strings.js"></script>
</head>
<body>

<header id="top-bar">
  <a class="topbar-logo" href="index.html">
    <div class="topbar-logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="5.5" stroke="white" stroke-width="1.3"/>
        <circle cx="8" cy="8" r="1.4" fill="white"/>
        <line x1="8" y1="2.5" x2="8" y2="4.6" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="8" y1="11.4" x2="8" y2="13.5" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="2.5" y1="8" x2="4.6" y2="8" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="11.4" y1="8" x2="13.5" y2="8" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="topbar-logo-text">KnobitMap</span>
  </a>
  <div class="topbar-banner">
    <div class="topbar-banner-inner">
      <span class="topbar-banner-dot"></span>
      <span data-i18n="parent.title">Lapsevanema vaade</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-burger-wrap">
      <button class="topbar-icon-btn topbar-burger" id="nav-menu" title="Menu">
        <svg width="16" height="14" viewBox="0 0 16 14" fill="none">
          <path d="M1 1h14M1 7h14M1 13h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="nav-dropdown" class="nav-dropdown">
        <button class="nav-dropdown-item" onclick="window.location='index.html'">
          <span data-i18n="nav.map">Kaart</span>
        </button>
        <button class="nav-dropdown-item" onclick="window.location='profile.html'">
          <span data-i18n="nav.account">Konto</span>
        </button>
        <button class="nav-dropdown-item active-page">
          <span data-i18n="parent.title">Lapsevanema vaade</span>
        </button>
        <div class="nav-dropdown-divider"></div>
        <button class="nav-dropdown-item" onclick="window.top.location='/auth/logout'">
          <span data-i18n="nav.log_out">Logi välja</span>
        </button>
      </div>
    </div>
  </div>
</header>
<script>
  document.getElementById('nav-menu').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('nav-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', function() {
    document.getElementById('nav-dropdown').classList.remove('open');
  });
</script>

<div class="teacher-layout">

  <!-- Child selector sidebar -->
  <nav class="teacher-sidebar" id="parent-sidebar">
    <div class="teacher-sidebar-title" data-i18n="parent.my_children">Minu lapsed</div>
    <div id="child-list" class="student-list"></div>
    <div class="teacher-sidebar-footer">
      <button class="p-edit-btn" onclick="window.showInviteModal('parent')">
        + <span data-i18n="parent.invite_child">Lisa laps</span>
      </button>
    </div>
  </nav>

  <!-- Child detail panel -->
  <main class="teacher-main" id="parent-main">
    <div id="parent-detail" class="teacher-detail-empty">
      <div class="teacher-empty-msg" data-i18n="parent.select_child">Vali laps vasakult.</div>
    </div>
  </main>

</div>

<!-- Invite modal -->
<div id="invite-modal" class="link-modal" style="display:none">
  <div class="link-modal-box">
    <div class="link-modal-title" data-i18n="link.share_code">Jaga seda koodi</div>
    <div id="invite-code-display" class="link-code-display"></div>
    <div class="link-modal-hint" data-i18n="link.code_hint_child">Laps sisestab selle koodi oma profiilis.</div>
    <button class="p-edit-btn primary" onclick="document.getElementById('invite-modal').style.display='none'" data-i18n="btn.close">Sulge</button>
  </div>
</div>

<script src="js/topbar-notif.js"></script>
<script src="js/parent.js"></script>
</body>
</html>
