<!-- ════ PARENT LAYOUT ════ -->
<div class="pa-wrap">

  <div class="pa-header">
    <span class="pa-title">Minu lapsed</span>
    <button class="ta-action-btn" id="btn-add-child">+ Lisa laps</button>
  </div>

  <!-- Children cards -->
  <div class="pa-children-section">
    <div class="pa-children-grid" id="children-grid"></div>
  </div>

  <!-- Child detail -->
  <div class="pa-detail-wrap" id="child-detail"></div>

</div>

<script src="js/topbar-notif.js"></script>
<script src="js/role-nav.js"></script>
<script>
(function () {

var CHILDREN = [
  { id:1, initials:'KL', name:'Karl', avatarClass:'pa-avatar-b',
    age:15, grade:'7. klass',
    streak:5,
    lastActive:'täna',
    goal:'Murdude liitmine', goalDomain:'Matemaatika › Aritmeetika › Murrud',
    goalProgress:78, goalDate:'20. juuli 2026',
    events:[
      {text:'Murdude liitmine: 78% edenemist', time:'täna, 09:14'},
      {text:'Harilikud murrud lõpetatud', time:'eile, 19:32'},
      {text:'Murdude lahutamine alustatud', time:'2 päeva tagasi'},
      {text:'Kümnendmurrud lõpetatud', time:'4 päeva tagasi'}
    ]
  },
  { id:2, initials:'LL', name:'Liis', avatarClass:'pa-avatar-c',
    age:12, grade:'4. klass',
    streak:3,
    lastActive:'eile',
    goal:'Eesti looduskaitse', goalDomain:'Loodusteadused › Eesti loodus',
    goalProgress:41, goalDate:'10. august 2026',
    events:[
      {text:'Eesti looduskaitse: 41% edenemist', time:'eile, 17:05'},
      {text:'Kaitsealad Eestis alustatud', time:'eile, 17:05'},
      {text:'Eesti metsloomad lõpetatud', time:'3 päeva tagasi'},
      {text:'Eesti looduskaitse eesmärk seatud', time:'6 päeva tagasi'}
    ]
  }
];

var selectedId = null;

function renderCards() {
  var grid = document.getElementById('children-grid');
  grid.innerHTML = CHILDREN.map(function(c){
    var sel = c.id === selectedId ? ' pa-card-selected' : '';
    return '<div class="pa-child-card'+sel+'" data-id="'+c.id+'">'
      +'<div class="pa-card-top">'
      +  '<div class="pa-avatar '+c.avatarClass+'">'+c.initials+'</div>'
      +  '<div class="pa-card-nameblock">'
      +    '<div class="pa-card-name">'+c.name+'</div>'
      +    '<div class="pa-card-sub">'+c.age+' a. · '+c.grade+'</div>'
      +    '<div class="pa-last-active">Aktiivne: '+c.lastActive+'</div>'
      +  '</div>'
      +'</div>'
      +'<div class="pa-stats-strip">'
      +  '<div class="pa-stat"><div class="pa-stat-val">'+c.streak+'🔥</div><div class="pa-stat-label">Päevi järjest</div></div>'
      +'</div>'
      +'<div class="pa-card-goal-label">Aktiivne eesmärk</div>'
      +'<div class="pa-card-goal-name">'+c.goal+'</div>'
      +'<div class="pa-bar-track"><div class="pa-bar-fill" style="width:'+c.goalProgress+'%"></div></div>'
      +'<div class="pa-bar-pct">'+c.goalProgress+'%'+(c.goalDate?' · tähtaeg '+c.goalDate:'')+'</div>'
      +'<div class="pa-card-footer">'
      +  '<span class="pa-card-rank">'+c.goalDomain+'</span>'
      +  '<span class="pa-card-view-link">Vaata lähemalt →</span>'
      +'</div>'
      +'</div>';
  }).join('');
  grid.querySelectorAll('.pa-child-card').forEach(function(el){
    el.addEventListener('click', function(){ selectChild(+el.dataset.id); });
  });
}

function selectChild(id) {
  selectedId = id;
  var c = CHILDREN.find(function(x){return x.id===id;});
  if (!c) return;
  document.querySelectorAll('.pa-child-card').forEach(function(el){
    el.classList.toggle('pa-card-selected', +el.dataset.id===id);
  });

  var eventsHtml = c.events.map(function(e){
    return '<div class="pa-event-row">'
      +'<div class="pa-event-dot"></div>'
      +'<div>'
      +  '<div class="pa-event-text">'+e.text+'</div>'
      +  '<div class="pa-event-time">'+e.time+'</div>'
      +'</div>'
      +'</div>';
  }).join('');

  var detail = document.getElementById('child-detail');
  detail.innerHTML =
    '<div class="pa-detail-header">'
    +'<div class="pa-detail-avatar '+c.avatarClass+'" style="width:56px;height:56px;font-size:20px">'+c.initials+'</div>'
    +'<div>'
    +  '<div class="pa-detail-name">'+c.name+'</div>'
    +  '<div class="pa-detail-sub">'+c.age+' aastat · '+c.grade+'</div>'
    +  '<div class="pa-detail-last">Aktiivne: '+c.lastActive+'</div>'
    +'</div>'
    +'<div style="margin-left:auto">'
    +  '<button class="ta-action-btn" onclick="closeDetail()">Sulge</button>'
    +'</div>'
    +'</div>'
    +'<div class="pa-detail-stats-row">'
    +  '<div class="pa-detail-stat"><div class="pa-detail-stat-val">'+c.streak+'🔥</div><div class="pa-detail-stat-label">Päeva järjest</div></div>'
    +'</div>'
    +'<div class="pa-detail-section">'
    +  '<div class="pa-detail-section-label">Aktiivne eesmärk</div>'
    +  '<div class="pa-goal-card">'
    +    '<div class="pa-goal-row"><div class="pa-goal-name">'+c.goal+'</div><div class="pa-goal-pct">'+c.goalProgress+'%</div></div>'
    +    '<div class="pa-goal-sub">'+c.goalDomain+'</div>'
    +    '<div class="pa-bar-track"><div class="pa-bar-fill" style="width:'+c.goalProgress+'%"></div></div>'
    +    (c.goalDate?'<div class="pa-goal-date">⏰ Tähtaeg: '+c.goalDate+'</div>':'')
    +  '</div>'
    +'</div>'
    +'<div class="pa-detail-section">'
    +  '<div class="pa-detail-section-label">Viimane tegevus</div>'
    +  eventsHtml
    +'</div>';

  detail.classList.add('pa-detail-visible');
  detail.scrollIntoView({behavior:'smooth', block:'start'});
}

window.closeDetail = function() {
  selectedId = null;
  document.querySelectorAll('.pa-child-card').forEach(function(el){ el.classList.remove('pa-card-selected'); });
  var detail = document.getElementById('child-detail');
  detail.classList.remove('pa-detail-visible');
  detail.innerHTML = '';
};

document.getElementById('btn-add-child').addEventListener('click', function(){
  // Generating a code now happens in Seaded (Connections), not here.
  (window.navOverlay || function (p) { window.location = p; })('settings.html#connections');
});

renderCards();

})();
</script>
</body>
</html>
